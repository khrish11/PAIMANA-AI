[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend", "."]
# Exclude large data directories from test discovery to prevent performance issues
norecursedirs = [
    "data",
    "data/extracted",
    "data/processed",
    "data/training",
    "data/validation",
    "data/artifacts",
    "data/REPORTS*",
    "node_modules",
    "dist",
    "__pycache__",
    "*.egg-info",
]
